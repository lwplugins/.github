name: Update README from Registry

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [registry-updated]
  push:
    branches: [main]
    paths:
      - .github/scripts/generate-readme.sh

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The generator is a script rather than inline YAML so the exact same
      # code can be run locally before a change is pushed.
      - name: Generate README from registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/generate-readme.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet profile/README.md && exit 0
          git add profile/README.md
          git commit -m "Update README from plugin registry"
          git push
